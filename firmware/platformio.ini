[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; Host-side unit tests never run on the device.
test_ignore = test_native

; Full compile check without reading ignored device credentials. This
; environment is not for upload: ci_secrets.h contains dummy values and an
; invalid CA certificate.
[env:esp32dev-ci]
extends = env:esp32dev
build_flags = -DBATTERY_MONITOR_CI

; Host build for pure-logic unit tests. PlatformIO defaults `test_build_src` to
; `no`, so src/ (which pulls in <Arduino.h>) is already kept out of this build;
; the tests include src/voltage_math.h directly, which is Arduino-free.
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=gnu++11
extra_scripts = pre:scripts/native_toolchain.py
